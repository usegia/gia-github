name: Public data integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:setup
      - run: pnpm lint && pnpm check:boundaries && pnpm check:release
      - run: pnpm --filter @gia-github/db --filter @gia-github/worker typecheck
      - name: Real PostgreSQL data and worker contracts
        run: pnpm exec vitest run --project integration tests/integration/database.integration.test.ts tests/integration/worker.integration.test.ts
      - if: failure()
        run: docker compose logs --no-color --tail 100 postgres
      - if: always()
        run: docker compose stop postgres
